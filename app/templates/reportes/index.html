{% extends "base.html" %}
{% block title %}Reportes - MiCredit{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0"><i class="bi bi-graph-up"></i> Reportes y Estadísticas</h4>
</div>

<div class="row g-3 mb-4">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><i class="bi bi-pie-chart"></i> Préstamos por Estado</div>
            <div class="card-body">
                <canvas id="chartEstados" height="200"></canvas>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><i class="bi bi-exclamation-triangle"></i> Morosidad</div>
            <div class="card-body">
                <canvas id="chartMorosidad" height="200"></canvas>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-header"><i class="bi bi-bar-chart"></i> Ingresos por Cobranza (Últimos 12 Meses)</div>
    <div class="card-body">
        <canvas id="chartPagos" height="250"></canvas>
    </div>
</div>

<div class="card mt-3">
    <div class="card-header"><i class="bi bi-file-spreadsheet"></i> Reportes Descargables</div>
    <div class="card-body">
        <div class="row g-2">
            <div class="col-md-4">
                <a href="{{ url_for('reportes.cartera') }}" class="btn btn-outline-primary w-100">
                    <i class="bi bi-cash"></i> Cartera de Créditos
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script>
$(function() {
    $.getJSON('{{ url_for("reportes.api_estadisticas") }}', function(data) {
        if (data.prestamos_por_estado) {
            const labels = Object.keys(data.prestamos_por_estado);
            const values = Object.values(data.prestamos_por_estado);
            const colors = {
                'pendiente': '#ffc107',
                'evaluacion': '#0dcaf0',
                'aprobado': '#198754',
                'desembolsado': '#0d6efd',
                'activo': '#0d6efd',
                'reprogramado': '#6f42c1',
                'cerrado': '#6c757d',
                'rechazado': '#dc3545',
                'castigado': '#dc3545'
            };
            new Chart(document.getElementById('chartEstados'), {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: labels.map(l => colors[l] || '#6c757d')
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        }
    });

    $.getJSON('{{ url_for("reportes.api_morosidad") }}', function(data) {
        new Chart(document.getElementById('chartMorosidad'), {
            type: 'bar',
            data: {
                labels: ['Al Día', 'Mora 1-30d', 'Mora 31-60d', 'Mora 60+d'],
                datasets: [{
                    label: 'Préstamos',
                    data: [data.al_dia, data.mora_30, data.mora_60, data.mora_90],
                    backgroundColor: ['#198754', '#ffc107', '#fd7e14', '#dc3545']
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: { beginAtZero: true, ticks: { stepSize: 1 } }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        });
    });
});
</script>
{% endblock %}
